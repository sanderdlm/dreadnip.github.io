<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>sluggish, lazy, stupid and unconcerned</title>
    <meta name="description" content="my homepage on the world wide web">
    <meta name="author" content="sander">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="images/icon.png">
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            max-width: none;
            white-space: nowrap;
        }
    </style>
</head>
<body contenteditable>
    <script>
        var KEY = 'write.html';
        document.body.innerHTML = localStorage.getItem(KEY) || '';

        var timer;
        document.body.addEventListener('input', function () {
            clearTimeout(timer);
            timer = setTimeout(function () {
                localStorage.setItem(KEY, document.body.innerHTML);
            }, 500);
        });
    </script>
</body>
</html>
